---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor
  namespace: saleor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor
  template:
    metadata:
      labels:
        app: saleor
    spec:
      initContainers:
        # Wait for postgres to be ready before starting
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U saleor; do
                echo "Waiting for postgres..."; sleep 2
              done
      containers:
        - name: saleor
          # Replace DOCKERHUB_USER with your Docker Hub username
          image: DOCKERHUB_USER/saleor-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: saleor-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saleor-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: saleor-secrets
                  key: SECRET_KEY
            - name: EMAIL_URL
              valueFrom:
                secretKeyRef:
                  name: saleor-secrets
                  key: EMAIL_URL
          volumeMounts:
            - name: media
              mountPath: /app/media
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: saleor-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: saleor
  namespace: saleor
spec:
  selector:
    app: saleor
  ports:
    - port: 8000
      targetPort: 8000
