---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: saleor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          # Replace DOCKERHUB_USER with your Docker Hub username
          image: DOCKERHUB_USER/saleor-dashboard:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /dashboard/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: saleor
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80
