apiVersion: v1
kind: ConfigMap
metadata:
  name: saleor-config
  namespace: saleor
data:
  # --- Database ---
  POSTGRES_DB: {{ .Values.postgres.db }}
  POSTGRES_USER: {{ .Values.postgres.user }}
  DATABASE_URL: "postgres://{{ .Values.postgres.user }}:{{ .Values.secrets.postgresPassword }}@postgres:5432/{{ .Values.postgres.db }}"

  # --- Cache / Celery ---
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CACHE_URL: "redis://redis:6379/0"

  # --- Saleor core ---
  DEBUG: "True"
  ALLOWED_HOSTS: "saleor,saleor.saleor.svc.cluster.local,localhost,{{ .Values.hostname }}"
  ALLOWED_CLIENT_HOSTS: "{{ .Values.hostname }},localhost"
  DEFAULT_FROM_EMAIL: "noreply@{{ .Values.hostname }}"

  # --- Static / Media ---
  STATIC_URL: "/static/"
  MEDIA_URL: "/media/"

  # --- Dashboard ---
  DASHBOARD_URL: "http://{{ .Values.hostname }}/dashboard/"
  STOREFRONT_URL: "http://{{ .Values.hostname }}/"

  # --- Uvicorn ---
  UVICORN_WORKERS: "1"
