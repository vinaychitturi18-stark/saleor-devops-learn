version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Production docker-compose for EC2
#
# Prerequisites:
#   1. Copy .env.prod.example to .env.prod and fill in all values
#   2. docker compose -f docker-compose.prod.yml build
#   3. docker compose -f docker-compose.prod.yml up -d
#
# First-time DB setup:
#   docker compose -f docker-compose.prod.yml run --rm saleor python manage.py populatedb --createsuperuser
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saleor}
      POSTGRES_USER: ${POSTGRES_USER:-saleor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saleor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Saleor Backend ──────────────────────────────────────────────────────────

  saleor:
    build:
      context: ./saleor
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.prod
    environment:
      DEBUG: "False"
      UVICORN_WORKERS: "4"
    volumes:
      - saleor-media:/app/media
      - saleor-static:/app/static
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M

  # ── Celery Worker ───────────────────────────────────────────────────────────

  worker:
    build:
      context: ./saleor
      dockerfile: Dockerfile
    restart: always
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.prod
    environment:
      DEBUG: "False"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1000M

  # ── Celery Beat Scheduler ───────────────────────────────────────────────────

  beat:
    build:
      context: ./saleor
      dockerfile: Dockerfile
    restart: always
    command: ["beat"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.prod
    environment:
      DEBUG: "False"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── Saleor Dashboard ────────────────────────────────────────────────────────

  dashboard:
    build:
      context: ./saleor-dashboard
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
        APP_MOUNT_URI: /dashboard/
        STATIC_URL: /dashboard/
    restart: always
    depends_on:
      - saleor
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── Saleor Storefront ───────────────────────────────────────────────────────

  storefront:
    build:
      context: ./saleor-storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
        NEXT_PUBLIC_DEFAULT_CHANNEL: ${NEXT_PUBLIC_DEFAULT_CHANNEL:-default-channel}
    restart: always
    depends_on:
      - saleor
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - saleor-static:/app/static:ro
      - saleor-media:/app/media:ro
    depends_on:
      - saleor
      - dashboard
      - storefront
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

volumes:
  postgres-data:
  saleor-media:
  saleor-static:
